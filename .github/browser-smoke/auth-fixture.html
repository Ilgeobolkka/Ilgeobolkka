<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" content="browser-smoke-token">
    <meta name="_csrf_header" content="X-CSRF-TOKEN">
    <title>인증 브라우저 smoke fixture</title>
    <script type="module" src="/auth-fixture.js"></script>
</head>
<body>
<div role="alert"
     aria-live="assertive"
     tabindex="-1"
     data-common-error
     hidden></div>
<section data-auth-page data-success-path="/books">
    <form method="post" data-auth-form data-auth-endpoint="/api/auth/login">
        <fieldset disabled data-auth-fields>
            <input name="email" type="email" required>
            <input name="password" type="password" required>
            <button type="submit">인증</button>
        </fieldset>
    </form>
</section>
</body>
</html>

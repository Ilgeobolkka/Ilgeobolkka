<!DOCTYPE html>
<html lang="ko" data-browser-smoke="running">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" content="browser-smoke-token">
    <meta name="_csrf_header" content="X-CSRF-TOKEN">
    <title>공통 브라우저 smoke</title>
    <script type="module" src="/browser-smoke.js"></script>
</head>
<body>
<div role="alert"
     aria-live="assertive"
     tabindex="-1"
     data-common-error
     hidden></div>
<div data-logout-fixtures></div>
<section data-ink-smoke-fixture>
    <output data-ink-balance>불러오는 중</output>
    <button type="button" data-ink-purchase>구매</button>
    <div role="status"
         aria-live="polite"
         tabindex="-1"
         data-ink-payment-status
         hidden></div>
    <button type="button" data-ink-payment-retry hidden></button>
    <table>
        <tbody data-ink-ledger></tbody>
    </table>
    <span data-ink-ledger-page></span>
    <button type="button" data-ink-ledger-previous disabled>이전</button>
    <button type="button" data-ink-ledger-next disabled>다음</button>
</section>
<output data-browser-smoke-result>RUNNING</output>
</body>
</html>

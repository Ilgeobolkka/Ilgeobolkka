name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ilgeobolkka
          MYSQL_USER: ilgeobolkka
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=10s

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6

      - name: 로컬 테스트용 dotenv 준비
        run: |
          printf '%s\n' \
            'DB_URL=jdbc:mysql://127.0.0.1:3306/ilgeobolkka?allowPublicKeyRetrieval=true&sslMode=DISABLED' \
            'DB_USERNAME=ilgeobolkka' \
            'DB_PASSWORD=ci-password' > .env

      - name: Java 21 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: 테스트·검사·패키징
        run: ./gradlew --no-daemon clean check build --warning-mode all

      - name: 실패 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-reports-${{ github.run_id }}
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 7

name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ilgeobolkka_test
          MYSQL_USER: ilgeobolkka
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=10s

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/ilgeobolkka_test?allowPublicKeyRetrieval=true&sslMode=DISABLED
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/ilgeobolkka_test?allowPublicKeyRetrieval=true&sslMode=DISABLED
      DB_USERNAME: ilgeobolkka
      DB_PASSWORD: ci-password

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6

      - name: Java 21 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: GitHub CLI 점검 스크립트 테스트
        run: bash .agents/skills/github-cli-setup/scripts/check-test.sh

      - name: 부팅 smoke 스크립트 테스트
        run: bash .github/scripts/boot-smoke-test.sh

      - name: Poppler 26.05.0 설정
        run: |
          "$CONDA/bin/conda" create \
            --yes \
            --quiet \
            --prefix "$RUNNER_TEMP/poppler-26.05.0" \
            --channel conda-forge \
            --override-channels \
            "poppler=26.05.0=hfdef1ce_3"
          "$RUNNER_TEMP/poppler-26.05.0/bin/pdftotext" -v 2>&1 \
            | grep --fixed-strings --line-regexp "pdftotext version 26.05.0"
          "$RUNNER_TEMP/poppler-26.05.0/bin/pdftoppm" -v 2>&1 \
            | grep --fixed-strings --line-regexp "pdftoppm version 26.05.0"

      - name: 테스트·검사·패키징
        env:
          RUN_CONTENT_IMPORT_INTEGRATION: "true"
          PDFTOTEXT_COMMAND: ${{ runner.temp }}/poppler-26.05.0/bin/pdftotext
          PDFTOPPM_COMMAND: ${{ runner.temp }}/poppler-26.05.0/bin/pdftoppm
        run: ./gradlew --no-daemon clean check build --warning-mode all

      - name: 실제 애플리케이션 부팅·브라우저 smoke 검증
        run: .github/scripts/boot-smoke.sh build/libs/Ilgeobolkka-0.0.1-SNAPSHOT.jar

      - name: 실패 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-reports-${{ github.run_id }}
          path: |
            build/reports/
            build/test-results/
            build/boot-smoke.log
          if-no-files-found: ignore
          retention-days: 7

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="border-bottom bg-white">
    <nav class="container d-flex align-items-center gap-4 py-3" aria-label="주요 메뉴">
        <a class="fs-4 fw-semibold text-decoration-none text-dark" th:href="@{/books}">
            읽어볼까
        </a>

        <ul class="nav align-items-center flex-grow-1">
            <li class="nav-item">
                <a class="nav-link"
                   th:classappend="${currentPath == '/books'} ? 'active'"
                   th:attr="aria-current=${currentPath == '/books' ? 'page' : null}"
                   th:href="@{/books}">도서 탐색</a>
            </li>
            <li class="nav-item ms-auto" th:unless="${authenticated}">
                <a class="nav-link" th:href="@{/signup}">회원가입</a>
            </li>
            <li class="nav-item" th:unless="${authenticated}">
                <a class="nav-link" th:href="@{/login}">로그인</a>
            </li>
            <li class="nav-item ms-auto" th:if="${authenticated}">
                <a class="nav-link" th:href="@{/ink}">잉크</a>
            </li>
            <li class="nav-item" th:if="${authenticated}">
                <a class="nav-link" th:href="@{/ownership-payments}">소장 결제 내역</a>
            </li>
            <li class="nav-item" th:if="${authenticated}">
                <a class="nav-link" th:href="@{/library}">내 서재</a>
            </li>
            <li class="nav-item" th:if="${authenticated}">
                <form th:action="@{/api/auth/logout}" method="post" data-logout-form>
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                    <button class="btn btn-link nav-link" type="submit">로그아웃</button>
                </form>
            </li>
        </ul>
    </nav>
</header>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="site-header">
    <nav class="site-nav" aria-label="주요 메뉴">
        <a class="site-brand" th:href="@{/}" aria-label="읽어볼까 홈">
            <span class="site-brand-mark" aria-hidden="true"></span>
            <span>읽어볼까</span>
        </a>

        <ul class="site-nav-list">
            <li class="nav-item">
                <a class="site-nav-link"
                   th:classappend="${#strings.startsWith(currentPath, '/books')} ? 'active'"
                   th:attr="aria-current=${#strings.startsWith(currentPath, '/books') ? 'page' : null}"
                   th:href="@{/books}">도서 탐색</a>
            </li>
            <li class="nav-item" th:if="${authenticated}">
                <a class="site-nav-link"
                   th:classappend="${currentPath == '/library'} ? 'active'"
                   th:attr="aria-current=${currentPath == '/library' ? 'page' : null}"
                   th:href="@{/library}">내 서재</a>
            </li>
            <li class="nav-item" th:if="${authenticated}">
                <a class="site-nav-link"
                   th:classappend="${currentPath == '/ink'} ? 'active'"
                   th:attr="aria-current=${currentPath == '/ink' ? 'page' : null}"
                   th:href="@{/ink}">잉크</a>
            </li>
            <li class="nav-item" th:if="${authenticated}">
                <a class="site-nav-link"
                   th:classappend="${currentPath == '/ownership-payments'} ? 'active'"
                   th:attr="aria-current=${currentPath == '/ownership-payments' ? 'page' : null}"
                   th:href="@{/ownership-payments}">소장 결제 내역</a>
            </li>
        </ul>

        <div class="site-account-nav">
            <a class="site-nav-link" th:unless="${authenticated}" th:href="@{/login}">로그인</a>
            <a class="btn btn-primary btn-sm" th:unless="${authenticated}" th:href="@{/signup}">회원가입</a>
            <form th:if="${authenticated}"
                  th:action="@{/api/auth/logout}"
                  method="post"
                  data-logout-form>
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                    <button class="site-account-button" type="submit">로그아웃</button>
            </form>
            <span class="site-account-dot" th:if="${authenticated}" aria-hidden="true"></span>
        </div>
    </nav>
</header>
</body>
</html>

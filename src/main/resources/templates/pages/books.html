<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/shell :: page(${pageTitle}, ~{::section})}">
<body>
<section class="catalog-page" data-book-list-root aria-labelledby="book-list-title">
    <header class="page-heading catalog-heading">
        <p class="eyebrow">읽고 싶은 책을 찾는 곳</p>
        <h1 id="book-list-title">도서 탐색</h1>
        <p>제목이나 저자로 필요한 도서를 찾아보세요.</p>
    </header>

    <form class="catalog-search"
          th:action="@{/books}"
          method="get"
          role="search"
          data-book-search-form>
        <div class="catalog-search-field">
            <label class="visually-hidden" for="book-search">제목 또는 저자 검색</label>
            <input class="form-control form-control-lg"
                   id="book-search"
                   name="keyword"
                   type="search"
                   placeholder="제목 또는 저자를 입력하세요"
                   autocomplete="off"
                   data-book-search>
        </div>
        <div>
            <button class="btn btn-primary btn-lg" type="submit">검색</button>
        </div>
    </form>

    <div class="catalog-layout">
        <aside class="catalog-guide" aria-labelledby="catalog-guide-title">
            <p class="eyebrow" id="catalog-guide-title">읽는 방법</p>
            <strong>잉크 1개로<br>한 쪽을 30일 대여</strong>
            <p>처음 여는 페이지에만 잉크가 차감되고, 대여 기간에는 다시 열어도 추가 차감이 없습니다.</p>
            <a th:if="${authenticated}" th:href="@{/ink}">내 잉크 확인하기 →</a>
            <a th:unless="${authenticated}" th:href="@{/signup}">읽기 시작하기 →</a>
        </aside>

        <div class="catalog-results">
            <p class="catalog-status" aria-live="polite" data-book-status>
                도서 목록을 불러오고 있습니다.
            </p>

            <div class="book-grid" data-book-list></div>

            <section class="empty-state" data-book-empty hidden>
                <h2 data-book-empty-title>표시할 도서가 없습니다.</h2>
                <p data-book-empty-description></p>
            </section>

            <nav class="pagination-bar" aria-label="도서 목록 페이지">
                <button class="btn btn-outline-secondary"
                        type="button"
                        data-book-previous
                        disabled>이전</button>
                <span data-book-page>불러오는 중</span>
                <button class="btn btn-outline-secondary"
                        type="button"
                        data-book-next
                        disabled>다음</button>
            </nav>
        </div>
    </div>

    <template data-book-card-template>
        <article class="book-card">
            <div class="card h-100 book-card-frame">
                <img class="card-img-top book-card-cover" data-book-cover alt="">
                <div class="book-card-cover-placeholder align-items-center justify-content-center"
                     data-book-cover-placeholder
                     hidden>
                    표지 없음
                </div>
                <div class="card-body d-flex flex-column px-0 pb-0">
                    <p class="book-card-category" data-book-category></p>
                    <h2 class="book-card-title">
                        <a class="stretched-link" data-book-title></a>
                    </h2>
                    <p class="book-card-meta" data-book-author></p>
                    <p class="book-card-price mt-auto" data-book-price></p>
                </div>
            </div>
        </article>
    </template>

    <script type="module" th:src="@{/js/book/catalog.js}"></script>
</section>
</body>
</html>

<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/shell :: page(${pageTitle}, ~{::section})}">
<body>
<section data-ink-page>
    <div class="d-flex align-items-start justify-content-between gap-4 mb-4">
        <div>
            <h1 class="h2 mb-2">잉크</h1>
            <p class="mb-0 text-secondary">잉크를 구매하고 현재 잔액과 사용 내역을 확인하세요.</p>
        </div>
        <div class="bg-white border rounded-3 px-4 py-3 text-end" aria-labelledby="ink-balance-title">
            <div class="small text-secondary" id="ink-balance-title">현재 잔액</div>
            <output class="fs-3 fw-semibold" data-ink-balance aria-live="polite">불러오는 중</output>
        </div>
    </div>

    <section class="bg-white border rounded-3 p-4 mb-4" aria-labelledby="ink-purchase-title">
        <div class="d-flex align-items-center justify-content-between gap-4">
            <div>
                <h2 class="h4 mb-2" id="ink-purchase-title">100잉크 구매</h2>
                <p class="mb-0 text-secondary"
                   th:text="${inkPurchaseEnabled
                       ? 'PortOne V2 테스트 채널에서 1,000원 카드 결제를 진행합니다.'
                       : '현재 환경에서는 잉크 구매를 사용할 수 없습니다.'}">
                    PortOne V2 테스트 채널에서 1,000원 카드 결제를 진행합니다.
                </p>
            </div>
            <button class="btn btn-primary flex-shrink-0"
                    type="button"
                    data-ink-purchase
                    th:disabled="${!inkPurchaseEnabled}"
                    th:text="${inkPurchaseEnabled ? '1,000원 결제' : '구매 비활성화'}">
                1,000원 결제
            </button>
        </div>
        <div class="alert mt-3 mb-0"
             role="status"
             aria-live="polite"
             aria-atomic="true"
             tabindex="-1"
             data-ink-payment-status
             hidden></div>
        <button class="btn btn-outline-primary mt-3"
                type="button"
                data-ink-payment-retry
                hidden></button>
    </section>

    <section class="bg-white border rounded-3 p-4" aria-labelledby="ink-ledger-title">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h2 class="h4 mb-0" id="ink-ledger-title">잉크 내역</h2>
            <span class="text-secondary" data-ink-ledger-page aria-live="polite">불러오는 중</span>
        </div>

        <div class="table-responsive">
            <table class="table align-middle mb-3">
                <caption class="visually-hidden">
                    최근 순서로 표시한 잉크 지급과 차감 내역
                </caption>
                <thead>
                <tr>
                    <th scope="col">변동</th>
                    <th scope="col">상세</th>
                    <th scope="col">변동 후 잔액</th>
                    <th scope="col">발생 시각</th>
                </tr>
                </thead>
                <tbody data-ink-ledger>
                <tr>
                    <td class="text-secondary text-center py-4" colspan="4">내역을 불러오는 중입니다.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <nav class="d-flex justify-content-center gap-2" aria-label="잉크 내역 페이지">
            <button class="btn btn-outline-secondary"
                    type="button"
                    data-ink-ledger-previous
                    disabled>이전</button>
            <button class="btn btn-outline-secondary"
                    type="button"
                    data-ink-ledger-next
                    disabled>다음</button>
        </nav>
    </section>

    <script type="module" th:src="@{/js/ink/ink.js}"></script>
</section>
</body>
</html>

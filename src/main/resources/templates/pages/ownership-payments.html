<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/shell :: page(${pageTitle}, ~{::section})}">
<body>
<section data-ownership-history-root aria-labelledby="ownership-history-title">
    <header class="mb-4">
        <h1 class="h2 mb-2" id="ownership-history-title">소장 결제 내역</h1>
        <p class="mb-0 text-secondary">
            완료된 도서 소장 결제만 잉크 내역과 분리해 최신순으로 확인합니다.
        </p>
    </header>

    <p class="text-secondary" aria-live="polite" data-ownership-history-status>
        소장 결제 내역을 불러오고 있습니다.
    </p>

    <section class="bg-white border rounded-3 p-4" aria-label="완료된 소장 결제">
        <div class="table-responsive">
            <table class="table align-middle mb-3">
                <caption class="visually-hidden">
                    결제 시각 최신순으로 표시한 완료된 소장 결제 내역
                </caption>
                <thead>
                <tr>
                    <th scope="col">도서</th>
                    <th scope="col">결제 금액</th>
                    <th scope="col">결제 시각</th>
                    <th scope="col">현재 상태</th>
                </tr>
                </thead>
                <tbody data-ownership-history-list>
                <tr>
                    <td class="text-secondary text-center py-4" colspan="4">
                        내역을 불러오는 중입니다.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex flex-column flex-sm-row align-items-center justify-content-center gap-3">
            <button class="btn btn-outline-secondary"
                    type="button"
                    data-ownership-history-previous
                    disabled>
                이전
            </button>
            <span class="text-secondary" data-ownership-history-page aria-live="polite">
                불러오는 중
            </span>
            <button class="btn btn-outline-secondary"
                    type="button"
                    data-ownership-history-next
                    disabled>
                다음
            </button>
        </div>
    </section>

    <script type="module" th:src="@{/js/ownership/ownership-history.js}"></script>
</section>
</body>
</html>

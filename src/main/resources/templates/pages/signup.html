<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/shell :: page(${pageTitle}, ~{::section})}">
<body>
<section class="auth-page"
         data-auth-page
         data-success-path="/login"
         aria-labelledby="signup-title">
    <div class="auth-card">
        <p class="eyebrow">NEW READER</p>
        <h1 id="signup-title">회원가입</h1>
        <p class="auth-lead">계정을 만든 뒤 로그인 화면에서 별도로 로그인해 주세요.</p>

        <noscript>
            <p class="alert alert-warning">회원가입하려면 JavaScript를 활성화해 주세요.</p>
        </noscript>

        <form method="post" data-auth-form th:data-auth-endpoint="@{/api/auth/signup}">
            <fieldset disabled data-auth-fields>
                <div class="mb-3">
                    <label class="form-label" for="signup-email">이메일</label>
                    <input class="form-control"
                           id="signup-email"
                           name="email"
                           type="email"
                           maxlength="255"
                           autocomplete="email"
                           required>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="signup-password">비밀번호</label>
                    <input class="form-control"
                           id="signup-password"
                           name="password"
                           type="password"
                           minlength="8"
                           autocomplete="new-password"
                           aria-describedby="signup-password-help"
                           required>
                    <div class="form-text" id="signup-password-help">
                        8자 이상이며 영문, 숫자, 공백이 아닌 ASCII 특수문자를 각각 포함해야 합니다.
                    </div>
                </div>

                <button class="btn btn-primary btn-lg w-100" type="submit">회원가입</button>
            </fieldset>
        </form>

        <p class="auth-switch">
            이미 계정이 있으신가요?
            <a th:href="@{/login}">로그인</a>
        </p>
    </div>

    <script type="module" th:src="@{/js/auth/auth.js}"></script>
</section>
</body>
</html>

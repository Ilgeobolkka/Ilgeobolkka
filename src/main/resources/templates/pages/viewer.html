<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/shell :: page(${pageTitle}, ~{::section})}">
<body>
<section class="viewer-shell"
         th:attr="data-book-id=${bookId},data-initial-page=${initialPage}"
         data-viewer-root
         aria-labelledby="viewer-title">
    <header class="viewer-topbar">
        <h1 class="viewer-title" id="viewer-title">
            <a th:href="@{/books/{bookId}(bookId=${bookId})}">
                <span aria-hidden="true">←</span>
                <span data-viewer-title>도서 뷰어</span>
            </a>
        </h1>

        <div class="viewer-progress-group">
            <p aria-live="polite" data-viewer-status>뷰어를 준비하고 있습니다.</p>
            <progress max="1" value="0" data-viewer-progress>0%</progress>
            <output data-viewer-progress-label aria-label="독서 진행률">0%</output>
        </div>

        <div class="viewer-display-controls">
            <div class="btn-group"
                 role="group"
                 aria-label="텍스트 글자 크기"
                 data-viewer-text-controls
                 hidden>
                <button class="btn btn-outline-secondary"
                        type="button"
                        aria-label="글자 크기 줄이기"
                        data-viewer-text-smaller>
                    가−
                </button>
                <button class="btn btn-outline-secondary"
                        type="button"
                        aria-label="글자 크기 키우기"
                        data-viewer-text-larger>
                    가+
                </button>
            </div>

            <div class="btn-group"
                 role="group"
                 aria-label="이미지 확대와 축소"
                 data-viewer-image-controls
                 hidden>
                <button class="btn btn-outline-secondary"
                        type="button"
                        aria-label="페이지 이미지 축소"
                        data-viewer-zoom-out>
                    축소
                </button>
                <button class="btn btn-outline-secondary"
                        type="button"
                        aria-label="페이지 이미지를 너비에 맞춤"
                        data-viewer-zoom-fit>
                    너비 맞춤
                </button>
                <button class="btn btn-outline-secondary"
                        type="button"
                        aria-label="페이지 이미지 확대"
                        data-viewer-zoom-in>
                    확대
                </button>
            </div>
        </div>
    </header>

    <div class="alert alert-warning"
         role="alert"
         tabindex="-1"
         data-viewer-notice
         hidden>
        <span data-viewer-notice-message></span>
        <a class="alert-link ms-2" th:href="@{/ink}" data-viewer-ink-link hidden>
            잉크 충전하기
        </a>
    </div>

    <div class="viewer-workspace">
        <div class="viewer-page"
             role="region"
             aria-label="페이지 콘텐츠"
             aria-describedby="viewer-keyboard-help"
             aria-live="polite"
             aria-busy="true"
             tabindex="-1"
             data-text-size="medium"
             data-image-zoom="100"
             data-viewer-content>
        </div>

        <aside class="viewer-sidebar" aria-labelledby="viewer-info-title">
            <h2 id="viewer-info-title">열람 정보</h2>
            <div class="viewer-info-card">
                <span>현재 권한</span>
                <strong data-viewer-access>열람 권한을 확인하고 있습니다.</strong>
            </div>
            <div class="viewer-info-card viewer-ink-card">
                <span>현재 잔액</span>
                <strong data-viewer-ink-balance>확인 중</strong>
            </div>

            <nav class="viewer-page-navigation" aria-label="페이지 이동">
                <button class="btn btn-outline-primary"
                        type="button"
                        aria-label="이전 페이지"
                        data-viewer-previous
                        disabled>
                    이전
                </button>

                <form data-viewer-page-form>
                    <label for="viewer-page-number">페이지</label>
                    <div class="viewer-page-input-group">
                        <input class="form-control text-end"
                               id="viewer-page-number"
                               type="number"
                               min="1"
                               inputmode="numeric"
                               aria-label="이동할 페이지 번호"
                               data-viewer-page-input
                               disabled>
                        <span aria-hidden="true">/ <span data-viewer-total-pages>-</span></span>
                        <button class="btn btn-primary"
                                type="submit"
                                aria-label="입력한 페이지로 이동"
                                data-viewer-page-submit
                                disabled>
                            이동
                        </button>
                    </div>
                </form>

                <button class="btn btn-outline-primary"
                        type="button"
                        aria-label="다음 페이지"
                        data-viewer-next
                        disabled>
                    다음
                </button>
            </nav>
        </aside>
    </div>

    <p class="visually-hidden" id="viewer-keyboard-help">
        페이지 콘텐츠에 포커스한 뒤 왼쪽 화살표 키로 이전 페이지,
        오른쪽 화살표 키로 다음 페이지로 이동할 수 있습니다.
    </p>

    <script type="module" th:src="@{/js/viewer/viewer.js}"></script>
</section>
</body>
</html>
